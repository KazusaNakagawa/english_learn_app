name: Launcher CI

# Tests the npm launcher (#206). It has no dependencies, so there is no
# install step; the web build it packages is validated by web-ci.yml.
on:
  push:
    branches: [develop, main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-ci.yml'

concurrency:
  group: launcher-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test launcher
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test
        run: npm test
